apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-api
  namespace: ecommerce
  labels:
    app: backend-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: backend-api

  template:
    metadata:
      labels:
        app: backend-api

    spec:
      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: backend-api
          image: 051987441306.dkr.ecr.ap-south-1.amazonaws.com/backend-api:58
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
